spring.application.name=ev-charging-platform

# PostgreSQL (docker compose maps it to host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/evcharging
spring.datasource.username=evcharging
spring.datasource.password=evcharging

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis (station cache)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.linger.ms=5

# Outbox relay polling interval
outbox.relay.interval-ms=500

management.endpoint.health.show-details=when-authorized

# JWT login (set JWT_SECRET to at least 32 random characters outside local dev)
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
app.jwt.ttl-minutes=60

# Login/registration rate limit (per client address and endpoint)
app.auth.rate-limit.max-requests=10
app.auth.rate-limit.window-seconds=60
